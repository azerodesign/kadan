# Gradle wrapper properties for Kadan.
# NOTE: the wrapper JAR is deliberately NOT committed in this folder, because
# this project was authored in a VM without an Android SDK and the binary
# push route is known-incapable. The GitHub Actions workflow does NOT rely
# on ./gradlew: it installs Gradle via gradle/actions/setup-gradle and runs
# `gradle assembleDebug`. If you want a local wrapper later, run
# `gradle wrapper --gradle-version 8.7` on a machine with Gradle installed
# and commit the generated gradle-wrapper.jar.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
