# Kadan — Android debug APK build (GitHub Actions).
#
# Why this exists: Kadan was authored in a VM with no Android SDK and
# almost no free RAM, so a local Gradle build there is not a realistic
# path to a testable APK. This workflow builds the debug APK in the
# cloud on every push to main and on pull requests, using the standard
# Android CI setup (JDK 17 + Android SDK + Gradle).
#
# It deliberately does NOT use ./gradlew: the gradle-wrapper.jar is not
# committed in this repo (see gradle/wrapper/gradle-wrapper.properties).
# Instead it installs Gradle via gradle/actions/setup-gradle and runs
# `gradle assembleDebug`. If a wrapper is added later, switch the build
# step to `./gradlew assembleDebug` and remove the setup-gradle step.
#
# It deliberately does NOT use android-actions/setup-android either:
# run #1 (2026-10-25, commit 313422b) failed in that step with
# "Failed to find package 'tools'" / sdkmanager exit code 1 — the
# obsolete 'tools' package no longer exists. ubuntu-latest runners
# already ship an Android SDK, so this workflow only ensures the
# exact platform/build-tools Kadan needs (compileSdk/targetSdk 34)
# are installed via the runner's own cmdline-tools sdkmanager.
#
# The debug APK is uploaded as an artifact named "kadan-debug-apk".
# It is NOT signed for release and NOT published to Google Play.
# Release signing (keystore, signing config, Play upload) is out of v1
# scope and must be added deliberately, never with a keystore committed
# to the repo.

name: Android Debug APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure Android SDK packages
        run: |
          SDKMANAGER=""
          for DIR in "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/cmdline-tools/16.0"; do
            if [ -x "$DIR/bin/sdkmanager" ]; then SDKMANAGER="$DIR/bin/sdkmanager"; break; fi
          done
          if [ -z "$SDKMANAGER" ]; then echo "sdkmanager not found under \$ANDROID_HOME/cmdline-tools"; exit 1; fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kadan-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
