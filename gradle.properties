# Kadan — Gradle properties.
# Keep the build small: no configuration cache surprises for a v1, and
# R8 is left on for release so the debug/release APK stays light on a
# mid-range phone with limited storage.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
